<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Boutiques</h2>
        <button class="btn btn-primary" routerLink="/home/boutique/new">
            <i class="bi bi-plus-lg"></i> Nouvelle Boutique
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Photo</th>
                        <th>Nom</th>
                        <th>Type</th>
                        <th>Jour d'ouverture</th>
                        <th>Heure Ouverture</th>
                        <th>Heure Fermeture</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let boutique of boutiques()">
                        <td>
                            <img [src]="boutique.photo ? 'http://localhost:3000/' + boutique.photo : 'assets/placeholder.png'"
                                class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td>
                            <strong>{{ boutique.nom }}</strong><br>
                        </td>
                        <td>{{ getTypeBoutiqueName(boutique.typeBoutique) }}</td>
                        <td>{{ boutique.nbJoursOuverture }}</td>
                        <td>{{ boutique.heureOuverture }}</td>
                        <td>{{ boutique.heureFermeture }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-2"
                                [routerLink]="['/home/boutique/edit', boutique._id]">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" (click)="deleteBoutique(boutique._id!)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="boutiques().length === 0">
                        <td colspan="7" class="text-center py-4 text-muted">Aucune boutique active</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
