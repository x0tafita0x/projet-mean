<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Types de Boutique</h2>
        <button class="btn btn-primary" routerLink="/home/type-boutique/new">
            <i class="bi bi-plus-lg"></i> Nouveau Type
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Nom</th>
                        <th>Date de Création</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let type of typeBoutiques()">
                        <td>{{ type.nom }}</td>
                        <td>{{ type.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-2"
                                [routerLink]="['/home/type-boutique/edit', type._id]">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" (click)="deleteType(type._id!)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="typeBoutiques().length === 0">
                        <td colspan="3" class="text-center py-4 text-muted">Aucun type de boutique trouvé</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
