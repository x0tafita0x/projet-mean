<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Etat</h2>
        <button class="btn btn-primary" routerLink="/home/etat/new">
            <i class="bi bi-plus-lg"></i> Nouvel Etat
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Id</th>
                        <th>Nom</th>
                        <th>Date de Création</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let etat of etats()">
                        <td>{{ etat._id }}</td>
                        <td>{{ etat.nom }}</td>
                        <td>{{ etat.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-2"
                                [routerLink]="['/home/etat/edit', etat._id]">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" (click)="deleteEtat(etat._id!)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="etats().length === 0">
                        <td colspan="3" class="text-center py-4 text-muted">Aucun état trouvé</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
