<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a routerLink="/home/type-boutique">Etat</a></li>
            <li class="breadcrumb-item active">{{ isEdit() ? 'Modifier' : 'Nouveau' }} Etat</li>
        </ol>
    </nav>

    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-header bg-white">
            <h2 class="h4 mb-0">{{ isEdit() ? 'Modifier l\'Etat' : 'Nouvel Etat' }}</h2>
        </div>
        <div class="card-body">
            <form (ngSubmit)="save()">
                <div class="mb-3">
                    <label for="nom" class="form-label">Nom de l'Etat</label>
                    <input type="text" id="nom" name="nom" class="form-control" [(ngModel)]="etat().nom" required
                        #nom="ngModel">
                    <div *ngIf="nom.invalid && (nom.dirty || nom.touched)" class="text-danger small">
                        Le nom est requis.
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light" routerLink="/home/etat">Annuler</button>
                    <button type="submit" class="btn btn-primary" [disabled]="loading() || !etat().nom">
                        {{ loading() ? 'Enregistrement...' : 'Enregistrer' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
