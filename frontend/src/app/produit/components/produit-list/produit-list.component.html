<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Produits</h2>
        <button class="btn btn-primary" routerLink="/home/produit/new">
            <i class="bi bi-plus-lg"></i> Nouveau Produit
        </button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Nom du produit</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Rechercher..."
                        [(ngModel)]="filters().nom">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Type</label>
                    <select class="form-select form-select-sm" [(ngModel)]="filters().typeProduit">
                        <option value="">Tous</option>
                        <option *ngFor="let t of typeProduits()" [value]="t._id">{{t.nom}}</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Sous-Type</label>
                    <select class="form-select form-select-sm" [(ngModel)]="filters().sousTypeProduit">
                        <option value="">Tous</option>
                        <option *ngFor="let st of sousTypeProduits()" [value]="st._id">{{st.nom}}</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Date Min</label>
                    <input type="date" class="form-control form-control-sm" [(ngModel)]="filters().startDate">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold text-muted">Date Max</label>
                    <input type="date" class="form-control form-control-sm" [(ngModel)]="filters().endDate">
                </div>
                <div class="col-md-1 d-flex gap-2 align-items-end">
                    <button class="btn btn-primary btn-sm w-100" (click)="applyFilters()" title="Filtrer">
                        <i class="bi bi-funnel"></i>
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" (click)="resetFilters()" title="Réinitialiser">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-12 text-end">
                    <div class="d-inline-flex align-items-center gap-2">
                        <span class="small text-muted fw-bold">Tri :</span>
                        <select class="form-select form-select-sm w-auto" [(ngModel)]="filters().order"
                            (change)="applyFilters()">
                            <option value="asc">Nom (A-Z)</option>
                            <option value="desc">Nom (Z-A)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 80px;">Photo</th>
                            <th>Nom</th>
                            <th>Sous-Type</th>
                            <th>Boutique</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let produit of produits()">
                            <td>
                                <img [src]="produit.photo ? 'http://localhost:3000/' + produit.photo : 'assets/placeholder.png'"
                                    class="img-thumbnail rounded" style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td>
                                <div class="fw-bold">{{ produit.nom }}</div>
                                <div class="small text-muted text-truncate" style="max-width: 250px;">{{ produit.info }}
                                </div>
                            </td>
                            <td><span class="badge bg-light text-dark">{{ getSousTypeName(produit.sousTypeProduit)
                                    }}</span></td>
                            <td><span class="text-secondary">{{ getBoutiqueName(produit.boutique) }}</span></td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-primary"
                                        [routerLink]="['/home/produit/edit', produit._id]" title="Modifier">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" (click)="deleteProduit(produit._id!)"
                                        title="Supprimer">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr *ngIf="produits().length === 0">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-search d-block mb-2 fs-2"></i>
                                Aucun produit trouvé
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <app-pagination [totalItems]="totalItems()" [pageSize]="pageSize()" [currentPage]="currentPage()"
                (pageChange)="onPageChange($event)">
            </app-pagination>
        </div>
    </div>
</div>
