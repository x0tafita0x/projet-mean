<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Produits</h2>
        <button class="btn btn-primary" routerLink="/home/produit/new">
            <i class="bi bi-plus-lg"></i> Nouveau Produit
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Photo</th>
                        <th>Nom</th>
                        <th>Sous-Type</th>
                        <th>Boutique</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let produit of produits()">
                        <td>
                            <img [src]="produit.photo ? 'http://localhost:3000/' + produit.photo : 'assets/placeholder.png'"
                                class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td>
                            <strong>{{ produit.nom }}</strong><br>
                            <small class="text-muted">{{ produit.info }}</small>
                        </td>
                        <td>{{ getSousTypeName(produit.sousTypeProduit) }}</td>
                        <td>{{ getBoutiqueName(produit.boutique) }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-2"
                                [routerLink]="['/home/produit/edit', produit._id]">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" (click)="deleteProduit(produit._id!)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="produits().length === 0">
                        <td colspan="5" class="text-center py-4 text-muted">Aucun produit trouvé</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
