<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Créer un compte Acheteur</h3>
                <p class="text-muted">Rejoignez-nous pour commencer vos achats</p>
            </div>

            @if (error()) {
            <div class="alert alert-danger mb-3" role="alert">
                {{ error() }}
            </div>
            }

            @if (success()) {
            <div class="alert alert-success mb-3" role="alert">
                Compte créé avec succès ! Redirection vers la connexion...
            </div>
            }

            <form (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label class="form-label">Nom complet</label>
                    <input type="text" class="form-control" [(ngModel)]="user.nom" name="nom" required
                        [disabled]="loading()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required
                        [disabled]="loading()">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" [(ngModel)]="user.motDePasse" name="motDePasse" required
                        [disabled]="loading()">
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg" [disabled]="loading() || success()">
                        @if (loading()) {
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        }
                        S'inscrire
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">Déjà un compte ? <a routerLink="/auth/login/acheteur" class="text-primary fw-bold">Se
                        connecter</a></p>
            </div>
        </div>
    </div>
</div>
