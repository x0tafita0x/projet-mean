<app-base-login [title]="'Connexion Admin'" [loading]="loading" [error]="error" (onLogin)="handleLogin($event)"
    [defaultCredentials]="{ email: 'admin@test.com', motDePasse: 'test' }">
    <div class="text-center mt-3">
        <hr class="my-2">
        <p class="text-muted small mb-1">Se connecter en tant que :</p>
        <div class="d-flex justify-content-center gap-3">
            <a routerLink="/auth/login/acheteur" class="text-decoration-none small"><i
                    class="bi bi-person me-1"></i>Acheteur</a>
            <a routerLink="/auth/login/boutique" class="text-decoration-none small"><i
                    class="bi bi-shop me-1"></i>Boutique</a>
        </div>
    </div>
</app-base-login>
